name: Build images & deploy to Firebase Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build responsive images
        run: npm run img:build

      # If you have a site build step, do it here (replace the echo):
      - name: Build site
        run: echo "No build step configured"


      - name: Lighthouse CI (pre-deploy)
        run: npm run lhci
        continue-on-error: true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci

      - name: Write Firebase service account
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JUSTNIEMANSWEBSITE }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firestore rules
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools deploy --only firestore:rules --project justniemanswebsite

      - name: Deploy Storage rules
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools deploy --only storage --project justniemanswebsite

      # Live deploy on pushes to main
      - name: Deploy Live (main)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JUSTNIEMANSWEBSITE }}
          projectId: justniemanswebsite
          channelId: live
